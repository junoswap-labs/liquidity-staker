[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules']
test = 'test'
solc = '0.8.19'
optimizer = true
optimizer_runs = 1000  # the factory embeds the pool's initcode; above ~10k runs it breaks EIP-170
evm_version = 'istanbul' # no PUSH0: KUB nodes may predate Shanghai
remappings = ['@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/']

[rpc_endpoints]
kub_testnet = "${KUB_TESTNET_RPC}"
kub_mainnet = "${KUB_MAINNET_RPC}"
